  <text x="442" y="614" font-size="15" font-weight="700" fill="#0f172a">8 branch applications in both models</text>
  <text x="442" y="638" font-size="15" font-weight="700" fill="#0f172a">37,973,120 MACs per image</text>
  <text x="442" y="662" font-size="15" fill="#0f172a">Counts convolutions and head only; GroupNorm,</text>
  <text x="442" y="686" font-size="15" fill="#0f172a">ReLU, residual add, pooling and memory traffic</text>
  <text x="442" y="710" font-size="15" fill="#0f172a">are omitted. No latency claim is made.</text>
  <rect x="808" y="548" width="368" height="176" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="808" y="548" width="8" height="176" rx="4" fill="#475569"/>
  <text x="834" y="582" font-size="18" font-weight="700" fill="#475569">E8 reference (not the main pair)</text>
  <text x="834" y="614" font-size="15" fill="#0f172a">Shared block + recall of the stem state</text>
  <text x="834" y="638" font-size="15" fill="#0f172a">(1×1 projection), variable depth, progressive</text>
  <text x="834" y="662" font-size="15" fill="#0f172a">loss, α = 0.05. 24,772 parameters;</text>
  <text x="834" y="686" font-size="15" fill="#0f172a">42,167,424 MACs. Official test:</text>
  <text x="834" y="710" font-size="15" font-weight="700" fill="#0f172a">E8 − B8 = −2.71 pp (negative).</text>
  <text x="40" y="748" font-size="14" fill="#475569">Counts come from recorded run metadata (seed 11, executed depth 8, width 32). Both main models share the same stem, readout and depth.</text>
