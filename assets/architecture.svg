<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="arch-title arch-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="arch-title">Untied B8 versus weight-shared C8: same executed depth, different parameter sharing</title>
  <desc id="arch-desc">Two matched pipelines. Both encode a 3 by 32 by 32 image with a stride-2 convolution to a 32-channel state, apply eight residual convolutional updates, and read out 100 class logits. B8 uses eight distinct weight sets W1 to W8; C8 reuses a single weight set W at all eight updates. Both execute 37,973,120 multiply-accumulates; B8 has 152,644 parameters and C8 has 22,724.</desc>
  <rect x="1" y="1" width="1198" height="768" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#0f172a">Equal executed depth, different parameter sharing</text>
  <text x="40" y="82" font-size="16" fill="#334155">Width 32 · eight residual updates, each adding 0.1 · F(h) to the state h · F = (GroupNorm, ReLU, 3×3 conv) applied twice, 8 groups</text>

