[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-weight-sharing-generalization"
version = "0.1.0"
description = "A controlled CIFAR-100 study of convolutional weight sharing"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7",
  "torchvision>=0.22",
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.scripts]
recurrent-cnn = "recurrent_cnn.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
