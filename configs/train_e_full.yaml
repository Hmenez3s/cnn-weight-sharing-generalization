# Research configuration template; explicit 2000-update horizon is an operational
# assumption, not a selected confirmatory budget. LR 0.01 is illustrative and unselected.
family: E
depth: 8
width: 32
alpha: 0.1
fraction: 1.0
paired_seed: 11
split_seed: 1729
role: research
synthetic: false
total_updates: 2000
cosine_horizon: 2000
batch_size: 128
learning_rate: 0.01
validation_cadence: 100
device: cuda
amp: false
progressive_weight: 0.5
recall: true
variable_depth: true
progressive_loss: true
